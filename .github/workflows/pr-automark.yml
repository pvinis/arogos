name: pr-automark

on:
  push:
    branches: [main]
    paths: ["pr-automark/**", ".github/workflows/pr-automark.yml"]
  pull_request:
    paths: ["pr-automark/**", ".github/workflows/pr-automark.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pr-automark
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
      - name: Read the version
        id: version
        run: echo "version=$(jq -r .version public/manifest.json)" >> "$GITHUB_OUTPUT"
      # Download it from the run's page, unzip it, and load the folder with Load unpacked
      - uses: actions/upload-artifact@v7
        with:
          name: pr-automark-${{ steps.version.outputs.version }}
          path: pr-automark/dist
          if-no-files-found: error
